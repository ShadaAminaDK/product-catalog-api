<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Product Catalog</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 30px;
            background: #f5f7fa;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 2.3rem;
        }

        button {
            display: block;
            margin: 0 auto;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s ease;
        }

        button:hover {
            background: #0056d2;
            transform: scale(1.05);
        }

        #products {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .product-name {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #222;
        }

        .product-info {
            margin: 5px 0;
            color: #555;
            font-size: 0.95rem;
        }

        .instock {
            font-weight: bold;
            color: green;
        }

        .outofstock {
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

    <h1>Product Catalog</h1>

    <button onclick="loadProducts()">Load All Products</button>

    <div id="products"></div>

    <script>
        function loadProducts() {
            fetch("/products")
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById("products");
                    container.innerHTML = "";

                    data.forEach(product => {
                        const card = document.createElement("div");
                        card.className = "product-card";

                        card.innerHTML = `
                            <div class="product-name">${product.name}</div>
                            <div class="product-info"><strong>Category:</strong> ${product.category}</div>
                            <div class="product-info"><strong>Price:</strong> ₹${product.price}</div>
                            <div class="product-info">
                                <strong>Status:</strong> 
                                <span class="${product.inStock ? "instock" : "outofstock"}">
                                    ${product.inStock ? "In Stock" : "Out of Stock"}
                                </span>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                });
        }
    </script>

</body>
</html>
